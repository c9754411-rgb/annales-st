<style>

  --sel:#3a3112; --selb:#f2b705; --kw:#ff5c86; --bn:#5cb6ff; --vio:#a78bfa; --t1:#5a4512; --t2:#0f4a3a; --t3:#33285e; --t4:#5a2234; --shadow:none; color-scheme:dark;}}

  --sel:#3a3112; --selb:#f2b705; --kw:#ff5c86; --bn:#5cb6ff; --vio:#a78bfa; --t1:#5a4512; --t2:#0f4a3a; --t3:#33285e; --t4:#5a2234; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}

/* header */

  padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.25)}

.wrap{max-width:1180px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}

.tile>div{min-width:0} .tile b.txt{font-size:1.05rem;line-height:1.15;overflow-wrap:anywhere}
@media(max-width:620px){table.st{font-size:.8rem} table.st th,table.st td{padding:.4em .2em} .cnt{min-width:1.6em;height:1.6em}}
.tile{border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);font-weight:700}
.tile .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.55);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
:root[data-theme="dark"] .tile .ic{background:rgba(255,255,255,.08)}
.hbtn svg,.ib svg{display:block} .hbtn{transition:background .15s} .hbtn:hover{background:rgba(255,255,255,.2)}

.t1{background:var(--t1)} .t2{background:var(--t2)} .t3{background:var(--t3)} .t4{background:var(--t4)}

.btn{border:0;border-radius:10px;padding:.55em 1em;font-weight:700;display:inline-flex;align-items:center;gap:.45em;justify-content:center;background:var(--surface2);border:1px solid var(--line)}

.side{display:none}

.side .lst{flex:1;overflow:auto;padding:4px 0}
.qn{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;padding:.55em .9em;font-weight:700;color:var(--muted);font-size:.95rem;border-left:3px solid transparent}

.sq{flex:none;min-width:2.3rem;height:2.3rem;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:.85rem;color:var(--muted)}

.sq.ok{background:var(--good);border-color:var(--good);color:#fff} .sq.ko{background:var(--bad);border-color:var(--bad);color:#fff} .sq.an{background:var(--sky);border-color:var(--sky);color:#fff}
.sess{display:flex;align-items:center;gap:10px;margin-bottom:8px}

.qhead{display:flex;gap:10px;align-items:flex-start}

.icons{display:flex;gap:4px}

.opt .tx{flex:1}

/* filtres */
const typeOk=(q,ft)=>ft==='all'||(ft==='case'?!!q.case:!q.case);
function poolC(fcs=S.fcs,fy=S.fy,ft=S.ft){ return Q.filter(q=>(!fcs.length||fcs.includes(q.c))&&(!fy||q.exam===fy)&&typeOk(q,ft)); }
function poolE(fe=S.fe){ return Q.filter(q=>q.exam===fe); }
const pool=()=>S.by==='exam'?poolE():poolC();
const EXI=Object.fromEntries(EXAMS.map(([k],i)=>[k,i]));
/* ordre : les questions d'un même cas clinique restent groupées */
const CASEGRP={'2026b-c6':'2026b-c5','2026b-c7':'2026b-c5','2026b-c8':'2026b-c5'};
function ordered(list,ord){
  const blocks=[]; const bi={};
  for(const q of list){ const k=(q.case&&CASEGRP[q.case])||q.case||q.id; if(bi[k]===undefined){ bi[k]=blocks.length; blocks.push([]); } blocks[bi[k]].push(q); }
  const ci=S.fcs.length?Object.fromEntries(S.fcs.map((c,i)=>[c,i])):Object.fromEntries(COURSES.map(([c],i)=>[c,i]));
  const byExam=(a,b)=>EXI[a[0].exam]-EXI[b[0].exam]||a[0].n-b[0].n;
  if(ord==='rand'){ for(let i=blocks.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [blocks[i],blocks[j]]=[blocks[j],blocks[i]]; } }
  else if(ord==='cours'){ blocks.sort((a,b)=>(ci[a[0].c]??99)-(ci[b[0].c]??99)||byExam(a,b)); }
  else blocks.sort(byExam);
  return blocks.flat().map(q=>q.id);
}
function sessTitle(){
  if(S.by==='exam') return 'Examen · '+EN[S.fe];
  const a=[]; a.push(S.fcs.length===0?'Tous les cours':S.fcs.length===1?CN[S.fcs[0]]:S.fcs.length+' cours'); if(S.fy) a.push(EN[S.fy]); return a.join(' · ');

function newSession(ids,title){

const sessList=()=>{ let L=LS.get('mt_sessions',null); if(!Array.isArray(L)){ L=[]; const l=LS.get('mt_last',null); if(l&&l.ids) L.push(l); LS.set('mt_sessions',L);} return L; };
const save=()=>{ const s=S.sess; LS.set('mt_last',s); if(!s||!s.ids) return; const L=sessList(); const k=L.findIndex(x=>x.start===s.start); if(k>=0) L[k]=s; else L.unshift(s); L.sort((a,b)=>(b.last||b.start)-(a.last||a.start)); LS.set('mt_sessions',L.slice(0,80)); };
const sessStat=x=>{ const n=x.ids.length, an=x.ids.filter(i=>x.ans[i]), g=an.filter(i=>x.ans[i].ok).length; return {n,g,r:an.length-g,a:an.length}; };

const showCorr=()=>S.sess.mode==='rev'||S.sess.finished;
function correctOf(q){ return new Set(q.key||[]); }
function gradeQ(q,a){
  if(!a) return false;
  if(q.type==='open') return !!a.ok;
  if(q.type==='match'){ return q.left.every(([L])=>{ const c=q.corr[L], g=(a.m&&a.m[L])||[]; return c.length===g.length && c.every(x=>g.includes(x)); }); }
  const c=correctOf(q), ch=new Set(a.ch||[]); if(c.size!==ch.size) return false; for(const x of c) if(!ch.has(x)) return false; return true;
}
function validate(){
  const s=S.sess, q=cur(); const sel=s.sel[q.id]||{}; if(s.ans[q.id]&&s.mode==='rev') return;
  if(q.type==='open'){ s.ans[q.id]={ch:[],open:1,ok:false}; save(); render(true); return; }
  const a = q.type==='match' ? {m:sel.m||{}} : {ch:sel.ch||[]};
  a.ok=gradeQ(q,a); s.ans[q.id]=a;
  if(s.mode==='rev'){ histSet(q.id,a.ok); LS.set('mt_hist',S.hist); play(a.ok?'ok':'ko'); }
  save(); render(true);
}
function finishExam(){
  const s=S.sess; s.finished=true;
  for(const id of s.ids){ if(QI[id].type==='open'&&!s.ans[id]) s.ans[id]={ch:[],open:1,ok:false}; }
  for(const id of s.ids){ const q=QI[id]; const sel=s.sel[id]; if(!s.ans[id] && sel){ const a=q.type==='match'?{m:sel.m||{}}:{ch:sel.ch||[]}; a.ok=gradeQ(q,a); s.ans[id]=a; } if(s.ans[id]&&!(q.type==='open'&&!s.ans[id].self)){ histSet(id,s.ans[id].ok); } }
  LS.set('mt_hist',S.hist); save(); S.view='end'; render(); scrollTo(0,0);
}

async function saveProgress(){

  const d=new Date(), stamp=d.toISOString().slice(0,10);
  const txt=JSON.stringify({app:'medtravail-laghouat',v:1,date:d.toISOString(),n:nDone(),data});

  try{ if(window.claude&&window.claude.use){ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename:fn,data:new Blob([txt],{type:'application/json'})}); ok=true; } } }catch(e){ if(e&&e.code==='declined'){ toast('Sauvegarde annulée'); return; } }

function mergeData(D){
  const J=(v,d)=>{ try{ return v==null?d:(typeof v==='string'?JSON.parse(v):v); }catch(e){ return d; } };
  const cur=k=>J(localStorage.getItem(k),null), inc=k=>J(D[k],null), put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  let ch=false; const chg=()=>{ch=true};
  const keys=new Set([...Object.keys(D),...Object.keys(localStorage)].filter(k=>k.startsWith('mt_')));
  for(const K of keys){ const B=kbase(K);
    if(B==='mt_hist'){ const a=cur(K)||{}, b=inc(K)||{}; for(const [k,v] of Object.entries(b)) if(!a[k]||(v.at||0)>(a[k].at||0)){ a[k]=v; chg(); } put(K,a); }
    else if(B==='mt_fav'){ const a=cur(K)||[], b=inc(K)||[]; const m=[...new Set([...a,...b])]; if(m.length!==a.length) chg(); put(K,m); }
    else if(B==='mt_notes'){ const a=cur(K)||{}, b=inc(K)||{}; for(const [k,v] of Object.entries(b)){ if(!a[k]||a[k]===v||v.includes(a[k])){ if(a[k]!==v) chg(); a[k]=v; } else if(!a[k].includes(v)){ a[k]=a[k]+'\n— \n'+v; chg(); } } put(K,a); }
    else if(B==='mt_hl'){ const a=cur(K)||{}, b=inc(K)||{}; for(const [k,L] of Object.entries(b)){ const seen=new Set((a[k]||[]).map(x=>JSON.stringify(x))); const add=L.filter(x=>!seen.has(JSON.stringify(x))); if(add.length) chg(); a[k]=(a[k]||[]).concat(add); } put(K,a); }
    else if(B==='mt_flk'){ const a=cur(K)||{}, b=inc(K)||{}; for(const [k,v] of Object.entries(b)) if(a[k]!==v){ a[k]=v; chg(); } put(K,a); }
    else if(B==='mt_last'){ const a=cur(K), b=inc(K); if(b&&(!a||(b.start||0)>(a.start||0))){ put(K,b); chg(); } }
    else if(B==='mt_sessions'){ const a=cur(K)||[], b=inc(K)||[]; const M=new Map(a.map(x=>[x.start,x])); for(const x of b){ const y=M.get(x.start); if(!y||(x.last||0)>(y.last||0)){ M.set(x.start,x); chg(); } }
      put(K,[...M.values()].sort((p,q)=>(q.last||q.start)-(p.last||p.start)).slice(0,80)); } }
  for(const [k,v] of Object.entries(D)) if(localStorage.getItem(k)===null&&typeof v==='string'){ localStorage.setItem(k,v); chg(); }
  let tot=0; for(const m of MIDS) tot+=Object.keys(cur('mt_hist_'+m)||{}).length;
  return {n:tot||Object.keys(cur('mt_hist')||{}).length, changed:ch};
}

  const parts=[['Énoncé',q.stem],...(q.opts||[]).map(([k,t])=>['Proposition '+k,t]),...(q.left||[]).map(([k,t])=>['Item '+k,t]),...Object.entries(q.p||{}).map(([k,v])=>['Explication '+k,v[1]]),['Commentaire',q.g||''],['Cas clinique',cs],['Résumé',q.cs||'']];

    case 'srep': S.srep=+v; S.sdel=null; render(true); return;
    case 'srepx': S.srep=null; render(true); return;
    case 'sstar': { const L=sessList(); const x=L.find(y=>y.start===+v); if(x){ x.star=!x.star; LS.set('mt_sessions',L); if(S.sess&&S.sess.start===x.start) S.sess.star=x.star; } render(true); return; }
    case 'sdel': { if(S.sdel!==+v){ S.sdel=+v; render(true); return; } const L=sessList().filter(y=>y.start!==+v); LS.set('mt_sessions',L); if(S.sess&&S.sess.start===+v){ S.sess=L[0]||null; LS.set('mt_last',S.sess); } S.sdel=null; render(true); return; }
    case 'sredo': { const x=sessList().find(y=>y.start===S.srep); S.srep=null; if(!x) return;
      if(v==='reset'){ Object.assign(x,{i:0,ans:{},sel:{},finished:false,review:false,spent:0,qstart:Date.now(),end:x.mode==='exam'?Date.now()+x.ids.length*60000:0}); delete x.endAt; S.sess=x; save(); S.view='quiz'; S.open=new Set(); render(); scrollTo(0,0); return; }
      const f={ok:i=>x.ans[i]&&x.ans[i].ok, ko:i=>x.ans[i]&&!x.ans[i].ok, un:i=>!x.ans[i], kun:i=>!(x.ans[i]&&x.ans[i].ok), all:()=>true}[v];
      const lab={ok:'Justes',ko:'Fausses',un:'Non répondues',kun:'À revoir',all:'Reprise'}[v];
      const prev=S.mode; S.mode=x.mode; newSession(x.ids.filter(f),lab+' · '+x.title); S.mode=prev; return; }
    case 'resume': if(S.sess){ S.view='quiz'; S.sess.qstart=Date.now(); render(); scrollTo(0,0);} return;
    case 'result': S.view='end'; render(); return;
    case 'home': S.view='home'; S.drop=null; render(); scrollTo(0,0); return;
    case 'opt': { const q=cur(); if(showCorr()&&s.ans[q.id]) return; if(s.mode==='exam'&&s.finished) return;
      const sel=s.sel[q.id]=s.sel[q.id]||{ch:[]}; const st=new Set(sel.ch||[]);
      if(q.type==='multi') st.has(v)?st.delete(v):st.add(v); else { if(st.has(v)) st.clear(); else { st.clear(); st.add(v); } }
      sel.ch=[...st]; if(s.mode==='exam') delete s.ans[q.id]; save(); render(true); return; }
    case 'mpick': { const q=cur(); if(showCorr()&&s.ans[q.id]) return; const [L,k]=v.split('|'); const sel=s.sel[q.id]=s.sel[q.id]||{m:{}}; sel.m=sel.m||{};
      const multi=Object.values(q.corr).some(x=>x.length>1); let g=new Set(sel.m[L]||[]);
      if(g.has(k)) g.delete(k); else { if(!multi) g.clear(); g.add(k); } sel.m[L]=[...g]; save(); render(true); return; }
    case 'cb': { const q=cur(); if(showCorr()&&s.ans[q.id]) return; if(s.mode==='exam'&&s.finished) return;
      const f=(q.cb||[]).find(c=>c[0]===v); if(!f) return; const ps=f[1];
      const sel=s.sel[q.id]=s.sel[q.id]||{ch:[]}; const cur0=sel.ch||[];
      const same=cur0.length===ps.length&&ps.every(x=>cur0.includes(x));
      sel.ch=same?[]:[...ps];
      if(s.strk&&s.strk[q.id]) s.strk[q.id]=s.strk[q.id].filter(x=>!ps.includes(x));
      if(s.mode==='exam') delete s.ans[q.id]; save(); render(true); return; }
    case 'validate': validate(); return;
    case 'strike': { const q=cur(); s.strk=s.strk||{}; const L=s.strk[q.id]=s.strk[q.id]||[]; const i=L.indexOf(v); if(i<0){ L.push(v); const sel=s.sel[q.id]; if(sel&&sel.ch) sel.ch=sel.ch.filter(x=>x!==v); } else L.splice(i,1); save(); render(true); return; }
    case 'why': S.open.has(v)?S.open.delete(v):S.open.add(v); render(true); return;
    case 'next': if(s.i+1<s.ids.length) go(s.i+1); else { if(s.mode==='exam'&&!s.finished){ s.endAt=Date.now(); finishExam(); } else { S.view='end'; render(); scrollTo(0,0);} } return;
    case 'prev': go(s.i-1); return;
    case 'goto': go(+v); return;
    case 'jump': S.view='quiz'; go(+v); return;
    case 'finish': s.endAt=Date.now(); finishExam(); return;
    case 'review': S.view='quiz'; go(0); return;
    case 'redo': { const l=s.ids.filter(i=>!(s.ans[i]&&s.ans[i].ok)); newSession(l,'Erreurs · '+s.title); return; }
    case 'fav': { const q=cur(); S.fav.has(q.id)?S.fav.delete(q.id):S.fav.add(q.id); LS.set('mt_fav',[...S.fav]); render(true); return; }
    case 'note': S.shownote=!S.shownote; render(true); if(S.shownote){ const na=document.getElementById('notearea'); if(na) na.focus(); } return;
    case 'tmp': { const t=+v; S.hideT.has(t)?S.hideT.delete(t):S.hideT.add(t); render(true); return; }
    case 'zoom': S.zoom=v; S.zk=100; try{history.pushState({z:1},'')}catch(e){} render(true); return;
    case 'zk': S.zk=Math.max(60,Math.min(300,(S.zk||100)+(+v)*40)); render(true); return;
    case 'noop': return;
    case 'hlrm': return;
    case 'unzoom': if(!S.zoom) return; S.zoom=null; render(true); try{ if(history.state&&history.state.z) history.back(); }catch(e){} return;
  }
}
document.addEventListener('click',async e=>{
  const pl=e.target.closest('a[data-pdf]');
  if(pl && window.claude && window.claude.use){ e.preventDefault(); const f=pl.dataset.pdf; const span=pl.querySelector('div span'); const old=span.textContent;
    try{ const dl=await window.claude.use('downloads'); if(!dl) throw 0; span.textContent='Préparation…'; const blob=await (await fetch(f)).blob(); await dl.save({filename:f,data:blob}); span.textContent=old; }
    catch(err){ span.textContent=err&&err.code==='declined'?old:'Téléchargement indisponible ici'; setTimeout(()=>{span.textContent=old},2500); } return; }
  if(S.drop && !e.target.closest('.pick')){ S.drop=null; render(true); return; }
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  if(e.target.closest('summary')) return;
  if(el.dataset.a==='clr'){ act('clr',el.dataset.v,el,e); return; }
  act(el.dataset.a,el.dataset.v,el,e);
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'){ if(e.key==='Escape'){S.drop=null;render(true);} return; }
  if(e.key==='/'&&S.view!=='quiz'&&!(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')){e.preventDefault();act('nav','search');return}
  if(S.sbOpen&&e.key==='Escape'){S.sbOpen=false;render(true);return}
  if(S.zoom&&(e.key==='Escape'||e.key==='Esc')){e.preventDefault();act('unzoom');return}
  if(S.kbd&&(e.key==='Escape'||e.key==='?')){S.kbd=false;render(true);return}
  if(e.key==='?'&&S.view==='quiz'){S.kbd=true;render(true);return}
  if(S.view==='flash'&&S.fl){ if(e.key===' '||e.key==='Enter'){e.preventDefault();act('fflip');return} if(e.key==='ArrowRight'){act('fnext');return} if(e.key==='ArrowLeft'){act('fprev');return}
    if(S.fl.flip&&(e.key==='1'||e.key==='2')){act('fgrade',e.key==='1'?'ko':'ok');return} return; }
  if(S.view!=='quiz') return; const q=cur();
  if(e.key==='Enter'){ e.preventDefault(); const s=S.sess; if(s.mode==='rev'&&!s.ans[q.id]) validate(); else act('next'); return; }
  if(e.key==='ArrowRight'){ act('next'); return; } if(e.key==='ArrowLeft'){ act('prev'); return; }
  if(q.type!=='match'&&q.type!=='open'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ const k=e.key.toUpperCase();
    if(/^[A-H]$/.test(k)&&q.opts['ABCDEFGH'.indexOf(k)]) act('opt',q.opts['ABCDEFGH'.indexOf(k)][0]);
    else if(q.opts.some(o=>o[0]===k)) act('opt',k);
    else if(/^[1-9]$/.test(k)&&q.opts[+k-1]) act('opt',q.opts[+k-1][0]); }
});
render();
try{ const m=sessionStorage.getItem('mt_toast'); if(m){ sessionStorage.removeItem('mt_toast'); setTimeout(()=>toast(m),300); } }catch(e){}
})();
</script>
